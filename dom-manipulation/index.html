

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator - Server Sync</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #667eea;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .sync-status {
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #e2e8f0;
    }

    .sync-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .sync-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #48bb78;
    }

    .sync-indicator.syncing {
      background: #ed8936;
      animation: pulse 1s infinite;
    }

    .sync-indicator.error {
      background: #f56565;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }

    .sync-text {
      font-size: 0.9em;
      color: #4a5568;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.95em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .filter-section {
      background: #f7fafc;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 2px solid #e2e8f0;
    }

    .filter-section h3 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.2em;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1em;
      background: white;
      cursor: pointer;
      font-family: inherit;
      color: #2d3748;
    }

    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    #quoteDisplay {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 20px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quote-text {
      font-size: 1.4em;
      color: #2d3748;
      font-style: italic;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .quote-category {
      font-size: 0.9em;
      color: #667eea;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .secondary-btn {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
    }

    .danger-btn {
      background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
    }

    .add-quote-form {
      background: #f7fafc;
      padding: 25px;
      border-radius: 15px;
      margin-top: 30px;
      border: 2px solid #e2e8f0;
      display: none;
    }

    .add-quote-form h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1em;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="file"] {
      display: none;
    }

    .file-input-label {
      display: inline-block;
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.95em;
      cursor: pointer;
      font-weight: 600;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      padding: 20px;
      background: #f7fafc;
      border-radius: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.9em;
      color: #718096;
      margin-top: 5px;
    }

    .empty-state {
      text-align: center;
      color: #718096;
      font-style: italic;
    }

    .data-management {
      background: #f7fafc;
      padding: 25px;
      border-radius: 15px;
      margin-top: 30px;
      border: 2px solid #e2e8f0;
    }

    .data-management h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .data-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #48bb78;
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: slideIn 0.3s ease-out;
      z-index: 1000;
      max-width: 350px;
    }

    .notification.error { background: #f56565; }
    .notification.warning { background: #ed8936; }
    .notification.info { background: #4299e1; }

    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .conflict-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .conflict-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .conflict-content h2 {
      color: #667eea;
      margin-bottom: 20px;
    }

    .conflict-item {
      background: #fff5f5;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid #f56565;
    }

    .conflict-item p {
      margin: 5px 0;
      font-size: 0.9em;
    }

    .conflict-item strong {
      color: #667eea;
    }

    .conflict-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .container { padding: 20px; }
      h1 { font-size: 1.8em; }
      .sync-status { flex-direction: column; gap: 10px; }
      .controls, .data-buttons { flex-direction: column; }
      button, .file-input-label { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ Dynamic Quote Generator</h1>
    
    <!-- Sync Status -->
    <div class="sync-status">
      <div class="sync-info">
        <div class="sync-indicator" id="syncIndicator"></div>
        <div class="sync-text" id="syncText">Status: Ready</div>
      </div>
      <button id="manualSyncBtn" onclick="syncWithServer()">🔄 Sync Now</button>
    </div>

    <!-- Category Filter -->
    <div class="filter-section">
      <h3>🔍 Filter by Category</h3>
      <select id="categoryFilter" onchange="filterQuotes()">
        <option value="all">All Categories</option>
      </select>
    </div>

    <!-- Quote Display -->
    <div id="quoteDisplay">
      <div class="empty-state">Click "Show New Quote" to get started!</div>
    </div>
    
    <!-- Controls -->
    <div class="controls">
      <button id="newQuote" onclick="showRandomQuote()">Show New Quote</button>
      <button id="toggleForm" onclick="toggleAddQuoteForm()">Add New Quote</button>
    </div>

    <!-- Add Quote Form -->
    <div id="addQuoteForm" class="add-quote-form">
      <h2>Add Your Own Quote</h2>
      <div class="form-group">
        <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
      </div>
      <div class="form-group">
        <input id="newQuoteCategory" type="text" placeholder="Enter quote category" />
      </div>
      <button onclick="addQuote()">Add Quote</button>
    </div>

    <!-- Data Management -->
    <div class="data-management">
      <h2>📦 Data Management</h2>
      <div class="data-buttons">
        <button class="secondary-btn" id="exportQuotes" onclick="exportToJsonFile()">📥 Export</button>
        <label for="importFile" class="file-input-label">📤 Import</label>
        <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
        <button class="danger-btn" onclick="clearAllData()">🗑️ Clear Data</button>
      </div>
    </div>

    <!-- Statistics -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-number" id="totalQuotes">0</div>
        <div class="stat-label">Total Quotes</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="totalCategories">0</div>
        <div class="stat-label">Categories</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="quotesViewed">0</div>
        <div class="stat-label">Viewed</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="lastSyncTime">Never</div>
        <div class="stat-label">Last Sync</div>
      </div>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
